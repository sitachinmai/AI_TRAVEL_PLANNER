<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Sky -->
  <rect width="600" height="280" fill="url(#skyGrad)" />
  <!-- Sun -->
  <circle cx="480" cy="90" r="45" fill="#fde047" opacity="0.9" />
  <!-- Clouds -->
  <ellipse cx="150" cy="90" rx="40" ry="20" fill="#ffffff" opacity="0.8" />
  <ellipse cx="180" cy="85" rx="30" ry="18" fill="#ffffff" opacity="0.8" />
  <ellipse cx="320" cy="110" rx="50" ry="22" fill="#ffffff" opacity="0.8" />
  <!-- Ground Mountains -->
  <path d="M 0 280 L 120 180 L 250 280 Z" fill="#6366f1" opacity="0.7" />
  <path d="M 180 280 L 340 140 L 480 280 Z" fill="#4f46e5" opacity="0.8" />
  <path d="M 380 280 L 500 190 L 600 280 Z" fill="#4338ca" opacity="0.6" />
  <!-- Foreground Landscape -->
  <rect y="275" width="600" height="125" fill="url(#groundGrad)" />
  <!-- Landmark Silhouette / Compass Pin -->
  <circle cx="300" cy="200" r="38" fill="#ffffff" opacity="0.9" />
  <path d="M 300 170 L 312 205 L 300 198 L 288 205 Z" fill="#ef4444" />
  <path d="M 300 230 L 312 195 L 300 202 L 288 195 Z" fill="#3b82f6" />
  <text x="300" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Travel Destination</text>
  <text x="300" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#ecfdf5" text-anchor="middle">Explore Verified Global Landmarks</text>
</svg>