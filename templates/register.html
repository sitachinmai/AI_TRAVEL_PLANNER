<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — {{ app_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <span class="logo-icon">✈️</span>
                <span class="logo-text">{{ app_name }}</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/explore" class="nav-link">Explore</a>
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="btn btn-primary btn-sm">Register</a>
            </nav>
        </div>
    </header>

    <main class="page-container flex-center">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Your Account 🌸</h2>
                <p>Join {{ app_name }} for intelligent travel planning</p>
            </div>

            <div id="auth-alert" class="alert alert-error hidden"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" id="full_name" class="form-control" placeholder="Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="aarav@example.com" required>
                </div>

                <div class="form-group">
                    <label for="mobile_number" class="form-label">Mobile Number</label>
                    <input type="tel" id="mobile_number" class="form-control" placeholder="+919876543210" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block margin-top-md">Sign Up 🚀</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login" class="link-bold">Log in</a></p>
            </div>
        </div>
    </main>

    {% include 'footer.html' %}

    <script src="/static/js/main.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
